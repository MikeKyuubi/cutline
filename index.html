<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutline</title>
<meta name="theme-color" content="#17201C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cutline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow operating column, sticky tab bar, cards only where a thing is a separate object (orders, gauges, logs). */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --ink:#17201C; --muted:#5B6862; --line:#D3D9D3; --chip:#E1E6E0;
  --accent:#D4521C; --accent-ink:#FFFFFF; --ok:#2C7649; --warn:#A8740A; --bad:#B5302A;
  --ok-bg:#E2F0E6; --fat:#5873A8; --warn-bg:#F6ECD3; --bad-bg:#F7E1DF;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --ink:#E3E9E5; --muted:#92A099; --line:#29332F; --chip:#212A26;
  --accent:#F0703A; --accent-ink:#140B06; --ok:#5DBF85; --warn:#E2AE3D; --bad:#EE6B60;
  --ok-bg:#16291E; --warn-bg:#2B2412; --bad-bg:#2E1714; --fat:#8DA6DA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --ink:#E3E9E5; --muted:#92A099; --line:#29332F; --chip:#212A26;
  --accent:#F0703A; --accent-ink:#140B06; --ok:#5DBF85; --warn:#E2AE3D; --bad:#EE6B60;
  --ok-bg:#16291E; --warn-bg:#2B2412; --bad-bg:#2E1714; --fat:#8DA6DA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .sub{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1 0 auto;font:700 1rem var(--display);text-transform:uppercase;letter-spacing:.04em;background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main section{display:grid;gap:14px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
button.btn,a.btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.btn:hover,a.btn:hover{border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07);border-color:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.field{display:grid;gap:4px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* Orders */
.orders{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.orders li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.orders li:last-child{border-bottom:0}
.orders li.ins{grid-template-columns:7.25rem 1fr;align-items:start}
.orders li.ins .tag{justify-self:start;margin-top:2px;white-space:nowrap}
.orders li[data-jump]{cursor:pointer;border-radius:6px}
.orders li[data-jump]:hover{background:var(--bg)}
.mark{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font:700 .8rem var(--mono)}
.mark.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mark.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mark.open{border-color:var(--warn)}
.coach{border-left:4px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:0 8px 8px 0;font-weight:500}
.coach.bad{border-color:var(--bad)} .coach.ok{border-color:var(--ok)}

/* Gauges */
.big{font:700 3rem/1 var(--display)}
.bar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar.over>i{background:var(--bad)}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.cups{display:flex;gap:10px}
.cup{width:52px;height:52px;border-radius:10px;border:2px dashed var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);font:700 .75rem var(--mono)}
.cup.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cup svg{width:24px;height:24px}

/* Lists */
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .nm{min-width:0;overflow-wrap:anywhere}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.food{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font:inherit;color:inherit}
.food:hover{border-color:var(--accent)}
.food .fn{font-weight:600;min-width:0}
.food .fk{font:600 .85rem var(--mono)}
.food .fp{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.tag{font:600 .7rem var(--mono);padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);text-transform:uppercase}
.tag.go{background:var(--ok-bg);color:var(--ok)} .tag.limit{background:var(--warn-bg);color:var(--warn)} .tag.avoid{background:var(--bad-bg);color:var(--bad)}

/* Daily budget */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:10px;border:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.wd b{font:700 1.15rem var(--display);color:var(--ink)}
.wd.today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd.today b{color:var(--accent-ink)}
.wd.ok{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.wd.warn{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.wd.bad{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.wd.future,.wd.none{opacity:.55}
.budget{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.bring{display:grid;justify-items:center;gap:6px;text-align:center}
.bring-wrap{position:relative;width:156px;height:156px;max-width:100%}
.bring-wrap .ring{display:block;max-width:100%;height:auto}
.bring-in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1.1}
.bnum{font:800 2.4rem/1 var(--display)}
.macros{display:grid;gap:10px}
.macro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.mval{font:700 1.35rem var(--display)}
.nuts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nut{display:grid;gap:4px;min-width:0}
@media (max-width:400px){.bring-wrap{width:132px;height:132px}.bnum{font-size:2rem}.nuts{grid-template-columns:1fr}}

/* Exercises */
details.ex{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details.ex summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px}
details.ex summary::-webkit-details-marker{display:none}
details.ex .body{padding:0 12px 14px 12px;display:grid;gap:8px}
details.ex ol{margin:0;padding-left:20px;display:grid;gap:4px}
.chk{width:26px;height:26px;accent-color:var(--ok);cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:.72rem;min-width:0}
.week div.today{border-color:var(--accent);border-width:2px}
.week b{display:block;font:700 .95rem var(--display);text-transform:uppercase}
.timer{font:700 2.4rem/1 var(--mono)}

/* Progress */
.chartbox{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat .v{font:700 1.8rem/1.1 var(--display)}
table.hist{width:100%;border-collapse:collapse;font-size:.85rem}
table.hist th,table.hist td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tablebox{overflow-x:auto}
.ai-out{display:grid;gap:8px}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
.auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.auth .box{max-width:420px;margin:8vh auto 0;display:grid;gap:16px}
.auth form{display:grid;gap:12px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<div class="auth" id="auth" hidden>
  <div class="box">
    <h1>Cutline</h1>
    <form class="card" id="connectForm" hidden>
      <h3>Connect your database</h3>
      <div class="small muted">Paste the two values from Supabase → Project Settings → API. You only need to do this if they are not built into the app yet.</div>
      <label class="field"><span class="label">Project URL</span><input id="cUrl" required placeholder="https://xxxx.supabase.co"></label>
      <label class="field"><span class="label">Anon public key</span><input id="cKey" required placeholder="eyJ…"></label>
      <button class="btn primary" type="submit">Connect</button>
    </form>
    <form class="card" id="loginForm" hidden>
      <h3>Sign in to sync</h3>
      <div class="small muted">Use the same email and password on your phone and laptop.</div>
      <label class="field"><span class="label">Email</span><input id="lEmail" type="email" autocomplete="email" required></label>
      <label class="field"><span class="label">Password</span><input id="lPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="row"><button class="btn primary" type="submit" value="signin">Sign in</button><button class="btn" type="submit" value="signup">Create account</button></div>
      <div class="small" id="authMsg"></div>
    </form>
    <button class="btn ghost" id="localOnly" type="button">Continue without syncing</button>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Cutline</h1><span class="sub num" id="hdrSub">74.0 → 69.0 kg</span></div>
    <span class="pill" id="syncPill"><span class="dot"></span><span id="syncText">Loading…</span></span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="train" aria-selected="false">Train</button>
    <button role="tab" data-tab="food" aria-selected="false">Food</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
  </nav>
  <main>
    <section id="tab-today"></section>
    <section id="tab-train" hidden></section>
    <section id="tab-food" hidden></section>
    <section id="tab-progress" hidden></section>
    <section id="tab-setup" hidden></section>
  </main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
